# ============================================================
# 后端配置模板（本地开发）
#
# 使用方法:
#   cp configs/config.example.yaml configs/config.dev.yaml
#   两处 passwd 已预填本地开发默认值（与 docker/.env 保持一致），通常无需修改；
#   复制后仅需补全标有「必填」的 api_key（同一厂商的 Key 可复用），即可启动
#
# 注意:
#   * config.dev.yaml 已被 .gitignore 忽略，仅保留在本地，请勿提交
#   * 预填的 passwd 仅为本地开发默认值，部署到任何对外环境请务必更换，
#     或直接用环境变量 POSTGRES_PASSWORD / STORAGE_PASSWORD 覆盖
#   * 敏感值（passwd / api_key）也可以留空，改由环境变量注入，优先级高于本文件:
#       POSTGRES_PASSWORD / STORAGE_PASSWORD / LLM_<配置位置>_API_KEY ...
#     变量清单见 docker/.env.example，覆盖逻辑见 src/utils/config_parser.py
#   * SERVER_ENV 缺省为 dev，加载本文件复制出的 config.dev.yaml；
#     容器部署固定 prod，加载 config.prod.yaml
# ============================================================
common:
  name: "education-ai"
  version: "v0.0.1"
  log_level: "DEBUG"
  env: "dev"
  # 调用大模型时的图片传入方式: url(图片地址) | base64(data url，适用于大模型无法访问的本地 MinIO)
  llm_image_input: "base64"
middleware:
  # 本段默认值与 docker/.env.example 保持一致，本机开发通常无需修改，
  # 只需把两个 passwd 填成 docker/.env 中的对应密码
  database:
    # .env 的 POSTGRES_HOST=postgres 为容器内主机名；后端跑在宿主机时用 PgBouncer 的映射端口
    host: "127.0.0.1"
    # POSTGRES_PORT
    port: "5432"
    # PGUSER
    user: "postgres"
    # 本地开发默认值，与 docker/.env 的 POSTGRES_PASSWORD 保持一致；对外环境务必更换
    passwd: "Eduvideo2026"
    # POSTGRES_DB
    db: "education-ai"
  storage:
    # PUBLIC_HOST + STORAGE_API_PORT + 桶名（宿主机直连 MinIO）
    domain: "http://localhost:9000/eduvideo"
    # 后端 S3 客户端地址；compose 容器内对应 STORAGE_HOST=http://minio:9000
    host: "http://127.0.0.1:9000"
    # 浏览器可达的预签名地址；compose 内由 PUBLIC_HOST + STORAGE_API_PORT 派生
    public_host: "http://localhost:9000"
    # STORAGE_ROOT_USER
    user: "admin"
    # 本地开发默认值，与 docker/.env 的 STORAGE_ROOT_PASSWORD 保持一致；对外环境务必更换
    passwd: "Eduvideo2026"
    # STORAGE_BUCKET
    bucket: "eduvideo"
  temporal:
    # TEMPORAL_SERVER_PORT=7233 的宿主机映射；容器内对应 TEMPORAL_SERVER_HOST:7233
    server_url: "127.0.0.1:7233"
product:
  eduvideo:
    tts_clone:
      base_url: "https://api.minimax.cn/v1/t2a_v2"
      # 必填：MiniMax API Key（也可通过 LLM_TTS_CLONE_API_KEY 环境变量注入）
      api_key: ""
      model: "speech-2.8-turbo"
      provider: "minimax"
      limit: 2
    agent_chat:
      base_url: "https://api.deepseek.com"
      # 必填：DeepSeek API Key（也可通过 LLM_AGENT_CHAT_API_KEY 环境变量注入）
      api_key: ""
      model: "deepseek-v4-flash"
      history_limit: 10
    magic_wand:
      text_model:
        base_url: "https://api.deepseek.com"
        # 必填：DeepSeek API Key（也可通过 LLM_MAGIC_WAND_TEXT_API_KEY 环境变量注入）
        api_key: ""
        model: "deepseek-v4-flash"
      image_model:
