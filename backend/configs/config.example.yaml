      - title: "数学英语讲解"
        url: "https://light4ai.space/education-ai/eduvideo/video-samples/%E6%95%B0%E5%AD%A6%E8%8B%B1%E8%AF%AD%E8%AE%B2%E8%A7%A3.mp4"
