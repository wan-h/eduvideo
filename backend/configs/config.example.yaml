tasks:
  server_url: "http://127.0.0.1:8000"
  base_task:
    start_to_close_timeout: 3
    task_queue: "base_task"
    concurrency: 20
  max_retries: 2
  doc_parse:
    start_to_close_timeout: 10
    task_queue: "doc_parse"
    concurrency: 1
    mineru:
      base_url: "https://mineru.net/api/v4"
      # 必填：MinerU API Key（也可通过 LLM_DOC_PARSE_API_KEY 环境变量注入）
      api_key: ""
      model: "pipeline"
      provider: "mineru"
  question_extract:
    start_to_close_timeout: 5
    task_queue: "question_extract"
    concurrency: 1
    extractor:
      base_url: "https://api.deepseek.com"
      # 必填：DeepSeek API Key（也可通过 LLM_QUESTION_EXTRACT_API_KEY 环境变量注入）
      api_key: ""
      model: "deepseek-v4-flash"
  readable_tts:
    max_task_queue_activities_per_second: 0.2
    start_to_close_timeout: 3
    task_queue: "readable_tts"
    fast_task_queue: "fast_readable_tts"
    concurrency: 10
    chinese_translate:
      base_url: "https://api.deepseek.com"
      # 必填：DeepSeek API Key（也可通过 LLM_READABLE_TTS_ZH_TRANSLATE_API_KEY 环境变量注入）
      api_key: ""
      model: "deepseek-v4-flash"
    latex_translate:
      base_url: "https://api.deepseek.com"
      # 必填：DeepSeek API Key（也可通过 LLM_READABLE_TTS_LATEX_TRANSLATE_API_KEY 环境变量注入）
      api_key: ""
      model: "deepseek-v4-flash"
    chinese:
      base_url: "https://api.minimax.cn/v1/t2a_v2"
      # 必填：MiniMax API Key（也可通过 LLM_READABLE_TTS_ZH_API_KEY 环境变量注入）
      api_key: ""
      model: "speech-2.8-turbo"
      provider: "minimax"
    english:
      base_url: "https://api.minimax.cn/v1/t2a_v2"
      # 必填：MiniMax API Key（也可通过 LLM_READABLE_TTS_EN_API_KEY 环境变量注入）
      api_key: ""
      model: "speech-2.8-turbo"
      provider: "minimax"
  question_explanation_video_gen_script:
    start_to_close_timeout: 10
    task_queue: "question_explanation_video_gen_script"
    concurrency: 1
    handout_generator:
      base_url: "https://api.deepseek.com"
      # 必填：DeepSeek API Key（也可通过 LLM_VIDEO_SCRIPT_HANDOUT_API_KEY 环境变量注入）
      api_key: ""
      model: deepseek-v4-flash
    image_generator:
      base_url: "https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
      # 必填：阿里云百炼 API Key（也可通过 LLM_VIDEO_SCRIPT_IMAGE_API_KEY 环境变量注入）
      api_key: ""
      model: "wan2.6-t2i"
      edit_model: "wan2.6-image"
      provider: "aliyun"
  question_explanation_video_gen_synthesis:
    start_to_close_timeout: 20
    task_queue: "question_explanation_video_gen_synthesis"
    concurrency: 1
    render_max_concurrency: 8
    render_parallel_chunks: 4
  question_solve:
    start_to_close_timeout: 10
    task_queue: "question_solve"
    concurrency: 1
    solver:
      base_url: "https://api.deepseek.com"
      # 必填：DeepSeek API Key（也可通过 LLM_QUESTION_SOLVE_API_KEY 环境变量注入）
      api_key: ""
      model: deepseek-v4-flash
  question_parse:
    start_to_close_timeout: 3
    task_queue: "question_parse"
    concurrency: 1
    parser:
      base_url: "https://api.deepseek.com"
      # 必填：DeepSeek API Key（也可通过 LLM_QUESTION_PARSE_API_KEY 环境变量注入）
      api_key: ""
      model: deepseek-v4-flash

server:
  ip: "0.0.0.0"
  port: 8000
