[project]
name = "backend"
version = "0.1.0"
description = "Eduvideo AI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "httpx>=0.28.1",
    "openai>=2.38.0",
    "pdf2image>=1.17.0",
    "python-magic>=0.4.27",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    "temporalio>=1.27.2",
    "tenacity>=9.1.4",
    "typst>=0.14.9",
    "uvicorn>=0.47.0",
    "deepagents>=0.6.4",
    "tavily-python>=0.7.24",
    "sqlalchemy>=2.0.50",
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "python-multipart>=0.0.30",
    "pydub>=0.25.1",
    "instructor>=1.15.1",
    "json-repair>=0.59.10",
    "pysbd>=0.3.4",
    "greenlet>=3.5.1",
    "fastapi==0.128.0",
    "cryptography<43.0.0",
    "alembic>=1.13.0",
]

[dependency-groups]
# 提供给 CI verify 阶段的静态检查 + 单测骨架工具。
# 测试用例目前只做最小覆盖，后续由后端 owner 补充。
dev = [
    "ruff>=0.14.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

# uv.lock 里所有依赖都解析自阿里云 PyPI 镜像；显式声明该 index，
# CI / 新环境无需依赖个人 ~/.config/uv 配置即可复现。
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.uv]
# 该仓库无 [build-system]，项目自身不作为包安装（与 Dockerfile 的
# `uv sync --no-install-project` 保持一致）。
package = false

[tool.ruff]
target-version = "py312"
line-length = 120
# 现存历史代码尚未整体格式化；本次只把 lint 门禁作用于新的 tests/ 目录，
# 其余目录由后端 owner 后续分批纳入。
include = ["tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-fail-under=50"
pythonpath = ["."]
