services:
  # 统一入口: 前端 SPA / 后端 API / MinIO 对象存储
  nginx:
    image: nginx:1.27.5
    restart: always
    depends_on:
      - web-eduvideo
      - srv-education-api
      - minio
    environment:
      # 容器内监听端口，与宿主机发布端口保持一致，避免两处配置分歧
      NGINX_HTTP_PORT: ${NGINX_HTTP_PORT}
      # 模板渲染用：各上游端口 / 地址
      SRV_EDU_PORT: ${SRV_EDU_PORT}
      WEB_EDUVIDEO_PORT: ${WEB_EDUVIDEO_PORT}
      # 与 app 侧派生规则一致：容器内直连 MinIO
      STORAGE_HOST: http://minio:${STORAGE_API_PORT}
      # 只替换上述变量，避免误伤 nginx 自身的 $host / $uri 等变量
      NGINX_ENVSUBST_FILTER: "^(NGINX_HTTP_PORT|SRV_EDU_PORT|WEB_EDUVIDEO_PORT|STORAGE_HOST)$"
    ports:
      - "${NGINX_HTTP_PORT}:${NGINX_HTTP_PORT}"
    volumes:
      # 官方镜像会把 templates/*.template 用 envsubst 渲染到 conf.d
      - ./configs/nginx/templates:/etc/nginx/templates:ro
    healthcheck:
      # nginx 镜像自带 curl，无 wget
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:${NGINX_HTTP_PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - shared_network
      - default