services:
  temporal-admin-tools:
      image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION}
      restart: on-failure:6
      depends_on:
        pgbouncer:
          condition: service_healthy
      environment:
        - DB=postgres12
        - DB_PORT=${POSTGRES_PORT}
        - POSTGRES_USER=${PGUSER}
        - POSTGRES_PWD=${POSTGRES_PASSWORD}
        - POSTGRES_SEEDS=${POSTGRES_HOST}
        - SQL_PASSWORD=${POSTGRES_PASSWORD}
      networks:
        - shared_network
      volumes:
        - ./configs/temporal/scripts:/scripts
      entrypoint: ["/bin/sh"]
      command: /scripts/setup-postgres.sh
  # temporalio server
  temporal-server:
    image: temporalio/server:${TEMPORAL_SERVER_VERSION}
    restart: always
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${PGUSER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=${POSTGRES_HOST}
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      # frontend gRPC 监听端口，容器内监听与宿主机发布保持一致
      - FRONTEND_GRPC_PORT=${TEMPORAL_SERVER_PORT}
    ports:
      - "${TEMPORAL_SERVER_PORT}:${TEMPORAL_SERVER_PORT}"
    networks:
      - shared_network
      - default
    volumes:
        - ./configs/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "${TEMPORAL_SERVER_PORT}"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60
  
  temporal-create-namespace:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION}
    restart: on-failure:5
    depends_on:
      temporal-server:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=${TEMPORAL_SERVER_HOST}:${TEMPORAL_SERVER_PORT}
      - DEFAULT_NAMESPACE=default
    networks:
      - shared_network
    volumes:
      - ./configs/temporal/scripts:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh

  # temporalio ui
  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    restart: always
    depends_on:
      temporal-server:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=${TEMPORAL_SERVER_HOST}:${TEMPORAL_SERVER_PORT}
      # UI 监听端口，容器内监听与宿主机发布保持一致
      - TEMPORAL_UI_PORT=${TEMPORAL_UI_PORT}
      # 与 UI 实际对外地址一致，避免写死无关端口
      - TEMPORAL_CORS_ORIGINS=http://${PUBLIC_HOST}:${TEMPORAL_UI_PORT}
      - TEMPORAL_CSRF_COOKIE_INSECURE=true
    ports:
      - "${TEMPORAL_UI_PORT}:${TEMPORAL_UI_PORT}"
    networks:
      - shared_network
      - default
