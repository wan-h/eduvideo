x-edu-common: &edu-common
  image: registry.cn-hangzhou.aliyuncs.com/docker-hub-aliyun-proxy/srv-eduvideo-api:${SRV_EDU_API_VERSION}
  restart: always
  depends_on:
      pgbouncer:
        condition: service_healthy
      minio:
        condition: service_healthy
      # bucket / 匿名只读策略就位后再启动，避免首次上传 404 NoSuchBucket
      storage-init:
        condition: service_completed_successfully
      temporal-server:
        condition: service_started
      # 等待一次性迁移任务成功后再启动，避免多容器并发迁移/表不存在
      srv-education-api-migrate:
        condition: service_completed_successfully
  environment:
    # 应用侧走 pgbouncer，不直连 postgres
    POSTGRES_HOST: ${PGBOUNCER_HOST}
    POSTGRES_PORT: ${POSTGRES_PORT}
    PGUSER: ${PGUSER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${SRV_EDU_DB}
    # 对象存储地址全部由「主机 + 端口」派生，避免 URL 内的端口与实际监听端口不一致
    # 对外访问前缀: 经统一入口 nginx 的 /storage/ 代理
    STORAGE_DOMAIN: http://${PUBLIC_HOST}:${NGINX_HTTP_PORT}/storage
    # 容器内直连 MinIO
    STORAGE_HOST: http://minio:${STORAGE_API_PORT}
    # 浏览器直连 MinIO（预签名 URL 用）
    STORAGE_PUBLIC_HOST: http://${PUBLIC_HOST}:${STORAGE_API_PORT}
    STORAGE_USER: ${STORAGE_ROOT_USER}
    STORAGE_PASSWORD: ${STORAGE_ROOT_PASSWORD}
    STORAGE_BUCKET: ${STORAGE_BUCKET}
    TEMPORAL_SEVER_URL: ${TEMPORAL_SERVER_HOST}:${TEMPORAL_SERVER_PORT}
    TEMPORAL_TASK_UPDATE_URL: http://${SRV_EDU_HOST}:${SRV_EDU_PORT}
    SERVER_ENV: ${SERVER_ENV:-prod}
    # 后端监听端口，需与 TEMPORAL_TASK_UPDATE_URL / healthcheck 保持一致
    SERVER_PORT: ${SRV_EDU_PORT}
    LOG_LEVEL: ${LOG_LEVEL:-}
    LLM_IMAGE_INPUT: ${LLM_IMAGE_INPUT:-base64}
    # === 大模型配置(优先级高于 config.prod.yaml，留空则沿用 yaml 中的值) ===
    # 商品 - TTS 音色克隆
    LLM_TTS_CLONE_BASE_URL: ${LLM_TTS_CLONE_BASE_URL:-}
    LLM_TTS_CLONE_API_KEY: ${LLM_TTS_CLONE_API_KEY:-}
    LLM_TTS_CLONE_MODEL: ${LLM_TTS_CLONE_MODEL:-}
    LLM_TTS_CLONE_PROVIDER: ${LLM_TTS_CLONE_PROVIDER:-}
    LLM_TTS_CLONE_LIMIT: ${LLM_TTS_CLONE_LIMIT:-}
    # 商品 - 对话助手
    LLM_AGENT_CHAT_BASE_URL: ${LLM_AGENT_CHAT_BASE_URL:-}
    LLM_AGENT_CHAT_API_KEY: ${LLM_AGENT_CHAT_API_KEY:-}
    LLM_AGENT_CHAT_MODEL: ${LLM_AGENT_CHAT_MODEL:-}
    LLM_AGENT_CHAT_HISTORY_LIMIT: ${LLM_AGENT_CHAT_HISTORY_LIMIT:-}
    # 商品 - 魔法棒(文本/图片)
    LLM_MAGIC_WAND_TEXT_BASE_URL: ${LLM_MAGIC_WAND_TEXT_BASE_URL:-}
    LLM_MAGIC_WAND_TEXT_API_KEY: ${LLM_MAGIC_WAND_TEXT_API_KEY:-}
    LLM_MAGIC_WAND_TEXT_MODEL: ${LLM_MAGIC_WAND_TEXT_MODEL:-}
    LLM_MAGIC_WAND_IMAGE_BASE_URL: ${LLM_MAGIC_WAND_IMAGE_BASE_URL:-}
    LLM_MAGIC_WAND_IMAGE_API_KEY: ${LLM_MAGIC_WAND_IMAGE_API_KEY:-}
    LLM_MAGIC_WAND_IMAGE_MODEL: ${LLM_MAGIC_WAND_IMAGE_MODEL:-}
    LLM_MAGIC_WAND_IMAGE_EDIT_MODEL: ${LLM_MAGIC_WAND_IMAGE_EDIT_MODEL:-}
    LLM_MAGIC_WAND_IMAGE_PROVIDER: ${LLM_MAGIC_WAND_IMAGE_PROVIDER:-}
    # 任务 - 文档解析(MinerU)
    LLM_DOC_PARSE_BASE_URL: ${LLM_DOC_PARSE_BASE_URL:-}
    LLM_DOC_PARSE_API_KEY: ${LLM_DOC_PARSE_API_KEY:-}
    LLM_DOC_PARSE_MODEL: ${LLM_DOC_PARSE_MODEL:-}
    LLM_DOC_PARSE_PROVIDER: ${LLM_DOC_PARSE_PROVIDER:-}
    # 任务 - 题目提取
    LLM_QUESTION_EXTRACT_BASE_URL: ${LLM_QUESTION_EXTRACT_BASE_URL:-}
    LLM_QUESTION_EXTRACT_API_KEY: ${LLM_QUESTION_EXTRACT_API_KEY:-}
    LLM_QUESTION_EXTRACT_MODEL: ${LLM_QUESTION_EXTRACT_MODEL:-}
    # 任务 - 可读性 TTS 及翻译
    LLM_READABLE_TTS_ZH_BASE_URL: ${LLM_READABLE_TTS_ZH_BASE_URL:-}
    LLM_READABLE_TTS_ZH_API_KEY: ${LLM_READABLE_TTS_ZH_API_KEY:-}
    LLM_READABLE_TTS_ZH_MODEL: ${LLM_READABLE_TTS_ZH_MODEL:-}
    LLM_READABLE_TTS_ZH_PROVIDER: ${LLM_READABLE_TTS_ZH_PROVIDER:-}
    LLM_READABLE_TTS_EN_BASE_URL: ${LLM_READABLE_TTS_EN_BASE_URL:-}
    LLM_READABLE_TTS_EN_API_KEY: ${LLM_READABLE_TTS_EN_API_KEY:-}
    LLM_READABLE_TTS_EN_MODEL: ${LLM_READABLE_TTS_EN_MODEL:-}
    LLM_READABLE_TTS_EN_PROVIDER: ${LLM_READABLE_TTS_EN_PROVIDER:-}
    LLM_READABLE_TTS_ZH_TRANSLATE_BASE_URL: ${LLM_READABLE_TTS_ZH_TRANSLATE_BASE_URL:-}
    LLM_READABLE_TTS_ZH_TRANSLATE_API_KEY: ${LLM_READABLE_TTS_ZH_TRANSLATE_API_KEY:-}
    LLM_READABLE_TTS_ZH_TRANSLATE_MODEL: ${LLM_READABLE_TTS_ZH_TRANSLATE_MODEL:-}
    LLM_READABLE_TTS_LATEX_TRANSLATE_BASE_URL: ${LLM_READABLE_TTS_LATEX_TRANSLATE_BASE_URL:-}
    LLM_READABLE_TTS_LATEX_TRANSLATE_API_KEY: ${LLM_READABLE_TTS_LATEX_TRANSLATE_API_KEY:-}
    LLM_READABLE_TTS_LATEX_TRANSLATE_MODEL: ${LLM_READABLE_TTS_LATEX_TRANSLATE_MODEL:-}
    # 任务 - 讲解视频脚本生成(讲义/配图)
    LLM_VIDEO_SCRIPT_HANDOUT_BASE_URL: ${LLM_VIDEO_SCRIPT_HANDOUT_BASE_URL:-}
    LLM_VIDEO_SCRIPT_HANDOUT_API_KEY: ${LLM_VIDEO_SCRIPT_HANDOUT_API_KEY:-}
    LLM_VIDEO_SCRIPT_HANDOUT_MODEL: ${LLM_VIDEO_SCRIPT_HANDOUT_MODEL:-}
    LLM_VIDEO_SCRIPT_IMAGE_BASE_URL: ${LLM_VIDEO_SCRIPT_IMAGE_BASE_URL:-}
    LLM_VIDEO_SCRIPT_IMAGE_API_KEY: ${LLM_VIDEO_SCRIPT_IMAGE_API_KEY:-}
    LLM_VIDEO_SCRIPT_IMAGE_MODEL: ${LLM_VIDEO_SCRIPT_IMAGE_MODEL:-}
    LLM_VIDEO_SCRIPT_IMAGE_EDIT_MODEL: ${LLM_VIDEO_SCRIPT_IMAGE_EDIT_MODEL:-}
    LLM_VIDEO_SCRIPT_IMAGE_PROVIDER: ${LLM_VIDEO_SCRIPT_IMAGE_PROVIDER:-}
    # 任务 - 题目解答/解析
    LLM_QUESTION_SOLVE_BASE_URL: ${LLM_QUESTION_SOLVE_BASE_URL:-}
    LLM_QUESTION_SOLVE_API_KEY: ${LLM_QUESTION_SOLVE_API_KEY:-}
    LLM_QUESTION_SOLVE_MODEL: ${LLM_QUESTION_SOLVE_MODEL:-}
    LLM_QUESTION_PARSE_BASE_URL: ${LLM_QUESTION_PARSE_BASE_URL:-}
    LLM_QUESTION_PARSE_API_KEY: ${LLM_QUESTION_PARSE_API_KEY:-}
    LLM_QUESTION_PARSE_MODEL: ${LLM_QUESTION_PARSE_MODEL:-}
    # === 任务队列/并发/超时配置(优先级高于 config.prod.yaml，留空则沿用 yaml 中的值) ===
    TASK_MAX_RETRIES: ${TASK_MAX_RETRIES:-}
    TASK_BASE_START_TO_CLOSE_TIMEOUT: ${TASK_BASE_START_TO_CLOSE_TIMEOUT:-}
    TASK_BASE_TASK_QUEUE: ${TASK_BASE_TASK_QUEUE:-}
    TASK_BASE_CONCURRENCY: ${TASK_BASE_CONCURRENCY:-}
    TASK_DOC_PARSE_START_TO_CLOSE_TIMEOUT: ${TASK_DOC_PARSE_START_TO_CLOSE_TIMEOUT:-}
    TASK_DOC_PARSE_TASK_QUEUE: ${TASK_DOC_PARSE_TASK_QUEUE:-}
    TASK_DOC_PARSE_CONCURRENCY: ${TASK_DOC_PARSE_CONCURRENCY:-}
    TASK_QUESTION_EXTRACT_START_TO_CLOSE_TIMEOUT: ${TASK_QUESTION_EXTRACT_START_TO_CLOSE_TIMEOUT:-}
    TASK_QUESTION_EXTRACT_TASK_QUEUE: ${TASK_QUESTION_EXTRACT_TASK_QUEUE:-}
    TASK_QUESTION_EXTRACT_CONCURRENCY: ${TASK_QUESTION_EXTRACT_CONCURRENCY:-}
    TASK_READABLE_TTS_MAX_TASK_QUEUE_ACTIVITIES_PER_SECOND: ${TASK_READABLE_TTS_MAX_TASK_QUEUE_ACTIVITIES_PER_SECOND:-}
    TASK_READABLE_TTS_START_TO_CLOSE_TIMEOUT: ${TASK_READABLE_TTS_START_TO_CLOSE_TIMEOUT:-}
    TASK_READABLE_TTS_TASK_QUEUE: ${TASK_READABLE_TTS_TASK_QUEUE:-}
    TASK_READABLE_TTS_FAST_TASK_QUEUE: ${TASK_READABLE_TTS_FAST_TASK_QUEUE:-}
    TASK_READABLE_TTS_CONCURRENCY: ${TASK_READABLE_TTS_CONCURRENCY:-}
    TASK_VIDEO_SCRIPT_START_TO_CLOSE_TIMEOUT: ${TASK_VIDEO_SCRIPT_START_TO_CLOSE_TIMEOUT:-}
    TASK_VIDEO_SCRIPT_TASK_QUEUE: ${TASK_VIDEO_SCRIPT_TASK_QUEUE:-}
    TASK_VIDEO_SCRIPT_CONCURRENCY: ${TASK_VIDEO_SCRIPT_CONCURRENCY:-}
    TASK_VIDEO_SYNTHESIS_START_TO_CLOSE_TIMEOUT: ${TASK_VIDEO_SYNTHESIS_START_TO_CLOSE_TIMEOUT:-}
    TASK_VIDEO_SYNTHESIS_TASK_QUEUE: ${TASK_VIDEO_SYNTHESIS_TASK_QUEUE:-}
    TASK_VIDEO_SYNTHESIS_CONCURRENCY: ${TASK_VIDEO_SYNTHESIS_CONCURRENCY:-}
    TASK_VIDEO_SYNTHESIS_RENDER_MAX_CONCURRENCY: ${TASK_VIDEO_SYNTHESIS_RENDER_MAX_CONCURRENCY:-}
    TASK_VIDEO_SYNTHESIS_RENDER_PARALLEL_CHUNKS: ${TASK_VIDEO_SYNTHESIS_RENDER_PARALLEL_CHUNKS:-}
    TASK_QUESTION_SOLVE_START_TO_CLOSE_TIMEOUT: ${TASK_QUESTION_SOLVE_START_TO_CLOSE_TIMEOUT:-}
    TASK_QUESTION_SOLVE_TASK_QUEUE: ${TASK_QUESTION_SOLVE_TASK_QUEUE:-}
    TASK_QUESTION_SOLVE_CONCURRENCY: ${TASK_QUESTION_SOLVE_CONCURRENCY:-}
    TASK_QUESTION_PARSE_START_TO_CLOSE_TIMEOUT: ${TASK_QUESTION_PARSE_START_TO_CLOSE_TIMEOUT:-}
    TASK_QUESTION_PARSE_TASK_QUEUE: ${TASK_QUESTION_PARSE_TASK_QUEUE:-}
    TASK_QUESTION_PARSE_CONCURRENCY: ${TASK_QUESTION_PARSE_CONCURRENCY:-}
  networks:
    - shared_network
    - default

services:
  # 一次性数据库迁移服务: 建库 + alembic upgrade head，成功后 rest 服务才会启动
  srv-education-api-migrate:
    <<: *edu-common
    restart: "no"
    depends_on:
      pgbouncer:
        condition: service_healthy
    entrypoint: ["python", "scripts/migrate.py"]

  srv-education-api:
    <<: *edu-common
    # ports:
    #   - "${SRV_EDU_PORT}:${SRV_EDU_PORT}"
    entrypoint: ["python", "main.py"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:${SRV_EDU_PORT}/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  srv-education-worker-base:
    <<: *edu-common
    entrypoint: ["python", "-m", "src.tasks.base.worker"]

  srv-education-worker-doc_parse:
    <<: *edu-common
    entrypoint: ["python", "-m", "src.tasks.doc_parse.worker"]

  srv-education-worker-readable_tts:
    <<: *edu-common
    entrypoint: ["python", "-m", "src.tasks.readable_tts.worker"]

  srv-education-worker-fast_readable_tts:
    <<: *edu-common
    entrypoint: ["python", "-m", "src.tasks.readable_tts.fast_worker"]

  srv-education-worker-question_extract:
    <<: *edu-common
    entrypoint: ["python", "-m", "src.tasks.question_extract.worker"]

  srv-education-worker-question_solve:
    <<: *edu-common
    entrypoint: ["python", "-m", "src.tasks.question_solve.worker"]

  srv-education-worker-question_parse:
    <<: *edu-common
    entrypoint: ["python", "-m", "src.tasks.question_parse.worker"]

  srv-education-worker-question_explanation_video_gen-script_gen:
    <<: *edu-common
    entrypoint: ["python", "-m", "src.tasks.question_explanation_video_gen.script_gen.worker"]

  srv-education-worker-question_explanation_video_gen-video_synthesis:
    <<: *edu-common
    entrypoint: ["python", "-m", "src.tasks.question_explanation_video_gen.video_synthesis.worker"]
  
  web-eduvideo:
    image: registry.cn-hangzhou.aliyuncs.com/docker-hub-aliyun-proxy/web-eduvideo:${WEB_EDUVIDEO_VERSION}
    restart: always
    depends_on:
      srv-education-api:
        condition: service_healthy
    environment:
      # === 基础配置 ===
      NODE_ENV: production
      # 前端容器内 nginx 监听端口（入口 nginx 按此端口转发）
      WEB_EDUVIDEO_PORT: ${WEB_EDUVIDEO_PORT}
      # === 后端 API 地址(留空 => 同源相对路径, 由 nginx 统一代理) ===
      VITE_BASE_API: ${WEB_EDUVIDEO_BASE_API}
      VITE_EDUAI_API_PREFIX: ${WEB_EDUVIDEO_EDUAI_API_PREFIX}
    # 不直接对外暴露，所有请求经 nginx
    expose:
      - "${WEB_EDUVIDEO_PORT}"

    # 健康检查：容器内 nginx 的 /health (nginx 镜像自带 curl，无 wget)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:${WEB_EDUVIDEO_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - shared_network
      - default